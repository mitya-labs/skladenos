<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig только для WindEmu (userscripts windemu-en*: FONTCONFIG_FILE): Qt5 берёт Noto Color Emoji для символов на кнопках
     Psion и рисует квадратики; без него берёт Symbola/Noto Sans Symbols2. Остальные программы шрифт видят как раньше. STATE п.110 -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Noto Color Emoji</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
